appId: com.paperanalysis.app
productName: PaperAnalysis
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
# Native modüller (better-sqlite3 vb.) Electron ABI'sine yeniden derlenir.
npmRebuild: true
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PaperAnalysis
mac:
  target: dmg
  category: public.app-category.business
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
