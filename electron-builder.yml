appId: com.paperanalysis.app
productName: PaperAnalysis
# Otomatik güncelleme: uygulama GitHub Releases'i kontrol eder, yeni sürümü
# indirip yerinde kurar (silip yeniden kurmaya gerek yok). Bu yapılandırma,
# pakete gömülen app-update.yml'i üretir (electron-updater bunu okur) ve
# derleme sırasında latest.yml + .blockmap güncelleme meta dosyalarını yaratır.
publish:
  provider: github
  owner: captainendis
  repo: PaperAnalysis
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
# Native modüller (better-sqlite3 vb.) Electron ABI'sine yeniden derlenir.
npmRebuild: true
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PaperAnalysis
mac:
  target: dmg
  category: public.app-category.business
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
