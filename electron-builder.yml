appId: com.paperaxis.paperanalysis
productName: PaperAnalysis
copyright: © 2026 PaperAxis. Tüm hakları saklıdır.
# Otomatik güncelleme: uygulama GitHub Releases'i kontrol eder, yeni sürümü
# indirip yerinde kurar (silip yeniden kurmaya gerek yok). Bu yapılandırma,
# pakete gömülen app-update.yml'i üretir (electron-updater bunu okur) ve
# derleme sırasında latest.yml + .blockmap güncelleme meta dosyalarını yaratır.
publish:
  provider: github
  owner: captainendis
  repo: PaperAnalysis
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - LICENSE
asarUnpack:
  - '**/*.node'
# Native modüller (better-sqlite3 vb.) Electron ABI'sine yeniden derlenir.
npmRebuild: true
win:
  # İki dağıtım biçimi: kurulum sihirbazı (NSIS) ve tek dosya taşınabilir (portable).
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  # Windows dosya özellikleri (PaperAxis standardı).
  legalTrademarks: PaperAxis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PaperAnalysis
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  # Kurulum gerektirmeyen tek dosya. Çalıştırıldığında kendini geçici bir dizine
  # açar; uygulama verisi (bağlantılar, ayarlar) exe'nin yanındaki
  # PaperAnalysis-Data klasöründe tutulur (bkz. src/main/portable.ts).
  artifactName: ${productName}-Portable-${version}.${ext}
  requestExecutionLevel: user
mac:
  target: dmg
  category: public.app-category.business
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
