name: Windows Kurulumu Oluştur

on:
  push:
    branches:
      - 'claude/power-bi-data-tool-jd5d1j'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Uygulamayı derle
        run: npm run build

      - name: Windows kurulumunu paketle (NSIS)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurulum dosyasını artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Release oluştur/güncelle (.exe + otomatik güncelleme meta dosyaları)
        uses: softprops/action-gh-release@v2
        with:
          # Etiketli push'ta o etiketi, dal push'unda sabit sürümü kullan.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.23' }}
          name: PaperAnalysis ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.23' }}
          # latest.yml ve .blockmap, electron-updater'ın otomatik güncelleme için
          # ihtiyaç duyduğu meta dosyalarıdır; .exe ile birlikte yüklenmelidir.
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          make_latest: 'true'
