name: Windows Kurulumu Oluştur

on:
  push:
    branches:
      - 'claude/power-bi-data-tool-jd5d1j'
      - 'claude/paperaxis-standard-portable-exe-4a2ifj'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # Sürüm tek kaynaktan gelir: package.json. Etiket adı da buradan türetilir.
      - name: Sürümü package.json'dan oku
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Güncelleme indirmesi token ister; token depoda değil, secret'ta durur ve
      # derleme sırasında pakete gömülür.
      - name: Uygulamayı derle
        run: npm run build
        env:
          PAX_API_TOKEN: ${{ secrets.PAX_API_TOKEN }}

      # Yapılandırmadaki iki hedef birlikte üretilir: NSIS kurulumu ve tek dosya
      # taşınabilir (portable) sürüm.
      - name: Windows paketlerini üret (NSIS + portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurulum dosyasını artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*-Setup-*.exe
          if-no-files-found: error

      - name: Taşınabilir sürümü artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/*-Portable-*.exe
          if-no-files-found: error

      # Her derlemede kurulum dosyası ve sürüm PaperAxis indirme servisine
      # yüklenir; uygulamanın otomatik güncelleme akışı bu kaydı okur.
      # Anahtar: depo ayarlarında Secrets and variables → Actions → PAX_API_TOKEN.
      - name: Kurulumu PaperAxis indirme servisine yükle
        run: npm run publish:pax
        env:
          PAX_API_TOKEN: ${{ secrets.PAX_API_TOKEN }}

      - name: Release oluştur/güncelle (.exe + otomatik güncelleme meta dosyaları)
        uses: softprops/action-gh-release@v2
        with:
          # Etiketli push'ta o etiketi, dal push'unda package.json sürümünü kullan.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: PaperAnalysis ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          # latest.yml ve .blockmap, electron-updater'ın otomatik güncelleme için
          # ihtiyaç duyduğu meta dosyalarıdır; .exe ile birlikte yüklenmelidir.
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          make_latest: 'true'
